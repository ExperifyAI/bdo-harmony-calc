const HELP={"Recipe":"Click a recipe to open four plans: direct and recursive, each with and without inventory.","Inputs / craft":"Immediate ingredients for one final crafting operation, before expanding intermediate recipes.","Direct cost / craft":"Gross purchase cost of all immediate ingredients divided by final crafts. No inventory or intermediate manufacturing.","Direct net / h":"(After-tax output sales + assumed net byproducts − immediate ingredient purchase costs) × 3600 ÷ final crafting seconds. Theoretical if inputs are unavailable.","Recursive net / h":"(After-tax sales, surplus and byproducts − purchased raw materials) × 3600 ÷ all crafting seconds. Manufactures every intermediate with a known recipe; buys other inputs. No inventory. Not a cheapest-path optimizer.","Cash net / h (owned)":"Recursive plan using your inventory first. (Net revenue − cash purchases) ÷ total crafting hours. Does not deduct the resale value of owned materials, so this is cash flow rather than economic profit.","Sale price":"Gross unit price of the normal-grade product. Blue output is priced separately in revenue.","Market stock":"Units of the normal product listed for purchase in the market snapshot; not demand or guaranteed sales.","Volume field":"Provider-reported fourteenDayVolume for the normal product. Not a guaranteed sales rate.","Sourcing":"Status of the recursive plan with inventory. Missing prices suppress profit calculations; Shortage means purchases exceed snapshot stock or stock is unknown. Available means no modeled shortage.","Crafts":"Number of final recipe operations, not finished units. Intermediate operations are additional.","Rank by":"Choose a sorting column; click a heading to reverse direction. Missing values remain at the bottom.","Economic profit/h":"(Net sales including surplus and modeled byproducts − cash purchases − opportunity cost of owned inputs) ÷ total crafting hours.","Cash profit/h":"(Net sales including surplus and modeled byproducts − cash pu ary)+'</div><h3>Star of Nostos — recorded drops only</h3><p class="muted">Not your full inventory. Existing pieces, purchases and other sessions are not included.</p><div class="panel">'+table(['Piece','Recorded drops','Goal','Remaining from records'],progress)+'</div><h3>Experiment backlog</h3><div class="panel">'+table(['Category','Spot','Resource','Reason'],SESSION_ROUTES.map(r=>'<tr>'+r.map(x=>td(esc(x))).join('')+'</tr>').join(''))+'</div>';
$('sessionFilter').value=sessionFilter;$('sessionFilter').onchange=e=>{sessionFilter=e.target.value;sessionView()};document.querySelectorAll('[data-ssort]').forEach(b=>b.onclick=()=>{const k=b.dataset.ssort;sessionDir=k===sessionSort?-sessionDir:['date','spot','category','agris'].includes(k)?1:-1;sessionSort=k;sessionView()});$('sessionAdd').onclick=()=>sessionForm(null);document.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick=()=>sessionForm(sessionRows.find(r=>r.id===b.dataset.editSession)));$('sessionExport').onclick=()=>download(sessionRows,'bdo-sessions.json');$('sessionImport').onchange=async e=>{try{const rows=JSON.parse(await e.target.files[0].text());if(!Array.isArray(rows)||!rows.every(validSession)||new Set(rows.map(r=>r.id)).size!==rows.length)throw Error('Invalid session data');if(!confirm('Replace session list?'))return;sessionRows=rows;if(!sessionSave())alert('Browser storage unavailable; export to retain changes.');sessionView()}catch(e){alert(e.message)}};}
function sessionForm(r){const a=r||{date:new Date().toISOString().slice(0,10),category:'Fluid Collecting',spot:'',resource:'',character:'',mastery:null,minutes:60,silver:0,basis:'Garmoth reported; tax unconfirmed',primary:null,nostos:null,agris:'Unknown',notes:'',url:''};const field=(k,l,t='text')=>'<label>'+esc(l)+'<input id="sf-'+k+'" type="'+t+'" '+(t==='number'?'min="0" step="any" ':'')+'value="'+esc(a[k]??'')+'"></label>';const sel=(k,l,opts)=>'<label>'+l+'<select id="sf-'+k+'">'+opts.map(x=>'<option'+(a[k]===x?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>';$('root').innerHTML='<button id="sfBack">← Sessions</button><h2 style="margin-top:15px">'+(r?'Edit':'Add')+' session</h2><div class="panel"><form id="sf"><div class="controls">'+field('date','Date','date')+sel('category','Category',sessionCategories)+field('spot','Spot')+field('resource','Primary resource')+field('character','Class / spec')+field('mastery','Mastery','number')+field('minutes','Duration (minutes)','number')+field('silver','Total reported silver (not per hour)','number')+field('primary','Primary quantity','number')+field('nostos','Nostos pieces','number')+sel('agris','Agris',['Unknown','Yes','No'])+field('basis','Valuation basis')+field('url','Garmoth URL','url')+field('notes','Buffs, costs and notes')+'</div><button type="submit">Save session</button> '+(r?'<button type="button" id="sfDelete">Delete session</button>':'')+'</form></div>';$('sfBack').onclick=sessionView;$('sf').onsubmit=e=>{e.preventDefault();const x={id:r?.id??(crypto.randomUUID?.()??String(Date.now()))};for(const k of ['date','category','spot','resource','character','basis','agris','notes','url'])x[k]=$('sf-'+k).value;for(const k of ['mastery','minutes','silver','primary','nostos']){const v=$('sf-'+k).value;x[k]=v===''?null:Number(v)}if(!validSession(x)){alert('Enter a spot, positive duration and valid nonnegative quantities.');return}sessionRows=r?sessionRows.map(z=>z.id===r.id?x:z):[...sessionRows,x];if(!sessionSave())alert('Browser storage unavailable; export to retain changes.');sessionView()};if(r)$('sfDelete').onclick=()=>{if(confirm('Delete this session?')){sessionRows=sessionRows.filter(z=>z.id!==r.id);sessionSave();sessionView()}};}

lanned","Configure skills and gear"],["Lifeskill main","Unspecified","Active","High weight and inventory; alchemy, cooking, gathering"],["Imperial delivery","Heidel alt","Assigned","Daily delivery"],["Fishing","Dedicated alt","Assigned","Miraculous Tank"],["Bartering","Barter alt / lifeskill main","Assigned","Main when energy refill is useful"],["Vell","Dedicated alt","Assigned","Boss"],["Garmoth","Dedicated alt","Assigned","Boss"],["LoML bosses","Dedicated alts","Assigned","One at each boss"],["Farming / herb gathering","Unspecified","To assign","Review alt roster"]], DEV_BACKLOG=[["Recipe database expansion","Pending","40 recipes currently; verified full alchemy coverage needed."],["Market coverage and refresh","In progress","On-demand MENA snapshot; automatic refresh deferred."],["Ingredient substitutions and mastery yields","Pending","Validate game data and observed procs."],["Recipe opportunity detector","Pending","Demand, margins, sourcing."],["Garmoth integration","Pending","Keep raw sessions there."],["Cooking calculator","Pending","Full cooking recipes not yet imported."],["Imperial calculator","Pending","Port spreadsheet calculations; validate rates and shared delivery constraints."],["Custom residual valuation calculator","Pending","Delotia and other non-market inputs."],["Cross-device persistence","Pending","Browser changes currently local; repository seeds managed by assistant."]];

function periodKey(freq){const d=new Date();const local=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(freq==='Hourly')return local+' '+d.getHours();if(freq==='Daily')return local;if(freq==='Weekly'){const w=new Date(d.getFullYear(),d.getMonth(),d.getDate());w.setDate(w.getDate()-((w.getDay()+6)%7));return [w.getFullYear(),w.getMonth()+1,w.getDate()].join('-')}return 'manual'}
