<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony Draught — BDO Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0e;
  --surface: #161618;
  --surface-hover: #1e1e22;
  --surface-active: #262629;
  --card: #1a1a1d;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.15);
  --text: #fafafa;
  --text-secondary: #a1a1aa;
  --text-tertiary: #52525b;
  --accent: #e4e4e7;
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.15);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.15);
  --gold: #f5c542;
  --blue: #3b82f6;
  --radius: 10px;
  --radius-sm: 6px;
  /* Draught colors */
  --fury: #ef4444;
  --adaptation: #3b82f6;
  --potential: #a855f7;
  --corruption: #f97316;
  --berserk: #22c55e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Layout */
.app { max-width: 1000px; margin: 0 auto; padding: 40px 24px 120px; }

/* Header */
.header { margin-bottom: 32px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.header-left {}
.header-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); margin-bottom: 8px; }
.header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.header-controls { display: flex; align-items: center; gap: 10px; }

/* Inputs */
.input-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0 12px; height: 38px;
}
.input-box label { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
.input-box input {
  background: none; border: none; color: var(--text); font-size: 14px; font-weight: 600;
  width: 50px; text-align: center; outline: none; font-family: inherit;
}
.btn {
  height: 38px; padding: 0 14px; border-radius: var(--radius); font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
  font-family: inherit; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-strong); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-primary:hover { opacity: 0.9; color: var(--bg); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 11px; }
.btn-danger { border-color: rgba(239,68,68,0.3); color: var(--red); }
.btn-danger:hover { background: var(--red-dim); border-color: rgba(239,68,68,0.5); }

/* Tabs */
.tabs {
  display: flex; gap: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 28px; width: fit-content;
}
.tab {
  padding: 9px 20px; font-size: 13px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; border: none; background: none; font-family: inherit;
  transition: all 0.15s; border-right: 1px solid var(--border); position: relative;
}
.tab:last-child { border-right: none; }
.tab:hover { color: var(--text); background: var(--surface-hover); }
.tab.active { color: var(--text); background: var(--surface-active); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* View pills */
.pills { display: flex; gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.pill {
  padding: 7px 14px; font-size: 12px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; border: none; background: none; font-family: inherit;
  transition: all 0.15s; border-right: 1px solid var(--border);
}
.pill:last-child { border-right: none; }
.pill:hover { color: var(--text); background: var(--surface-hover); }
.pill.active { color: var(--text); background: var(--surface-active); }

/* Section labels */
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); margin-bottom: 10px; }

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
  border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02);
}
.card-header h2 { font-size: 14px; font-weight: 600; }

/* Color stripe */
.stripe { width: 3px; border-radius: 2px; align-self: stretch; flex-shrink: 0; }
.stripe-fury { background: var(--fury); }
.stripe-adaptation { background: var(--adaptation); }
.stripe-potential { background: var(--potential); }
.stripe-corruption { background: var(--corruption); }
.stripe-berserk { background: var(--berserk); }

/* Recipe tree */
.tree-row {
  display: grid; align-items: center; gap: 10px; padding: 12px 20px;
  cursor: pointer; transition: background 0.1s; border-bottom: 1px solid var(--border);
}
.tree-row:last-child { border-bottom: none; }
.tree-row:hover { background: var(--surface-hover); }
.tree-row.draught { grid-template-columns: 3px 20px 1fr auto auto; font-weight: 500; }
.tree-row.elixir { grid-template-columns: 3px 20px 8px 1fr auto auto; padding-left: 32px; font-size: 13px; }
.tree-row.ingredient { grid-template-columns: 1fr auto auto; padding-left: 72px; font-size: 12px; color: var(--text-tertiary); cursor: default; }
.tree-row.ingredient:hover { background: transparent; }

.expand { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 10px; transition: transform 0.2s; }
.expand.open { transform: rotate(90deg); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); }
.qty { font-size: 12px; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 55px; text-align: right; }
.price { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; }
.price.has-price { color: var(--text-secondary); }

.sub-rows { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
.sub-rows.open { max-height: 3000px; }

/* Recipe toolbar */
.recipe-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

/* Inventory */
.inv-group { margin-bottom: 24px; }
.inv-group-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer;
}
.inv-group-header h3 { font-size: 13px; font-weight: 600; }
.inv-group-header .expand { color: var(--text-secondary); }
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: var(--border); border-radius: 8px; overflow: hidden; }
.inv-item {
  display: flex; align-items: center; justify-content: space-between; padding: 8px 14px;
  background: var(--surface); font-size: 13px; gap: 8px;
}
.inv-item .name { color: var(--text-secondary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inv-item .have-need { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.inv-item input {
  width: 52px; height: 28px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 12px; font-weight: 600; text-align: center; font-family: inherit; outline: none;
}
.inv-item input:focus { border-color: var(--border-strong); }
.inv-item .need { font-size: 11px; color: var(--text-tertiary); min-width: 40px; text-align: right; }
.inv-item .need.satisfied { color: var(--green); }
.inv-item .need.remaining { color: var(--red); }

.inv-search {
  width: 100%; height: 38px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0 14px; color: var(--text); font-size: 13px;
  font-family: inherit; outline: none; margin-bottom: 20px;
}
.inv-search:focus { border-color: var(--border-strong); }
.inv-search::placeholder { color: var(--text-tertiary); }

/* Analysis */
.analysis-card { margin-bottom: 20px; }
.analysis-row {
  display: grid; grid-template-columns: 3px 1fr auto auto auto; align-items: center; gap: 12px;
  padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 13px;
}
.analysis-row:last-child { border-bottom: none; }
.analysis-row .label { color: var(--text-secondary); }
.analysis-row .craft-cost, .analysis-row .buy-cost { font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
.analysis-row .verdict { font-weight: 600; font-size: 12px; min-width: 90px; text-align: right; padding: 3px 8px; border-radius: var(--radius-sm); }
.verdict-craft { color: var(--green); background: var(--green-dim); }
.verdict-buy { color: var(--red); background: var(--red-dim); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px;
}
.stat-card .stat-label { font-size: 11px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.stat-card .stat-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.stat-card .stat-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
.stat-green { color: var(--green); }
.stat-red { color: var(--red); }
.stat-gold { color: var(--gold); }
.stat-blue { color: var(--blue); }

/* Cost bar chart */
.cost-bars { padding: 16px 20px; }
.cost-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.cost-bar-row:last-child { margin-bottom: 0; }
.cost-bar-label { font-size: 12px; color: var(--text-secondary); min-width: 120px; }
.cost-bar-track { flex: 1; height: 24px; background: rgba(255,255,255,0.03); border-radius: 4px; overflow: hidden; position: relative; }
.cost-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); min-width: fit-content; }
.cost-bar-pct { font-size: 11px; color: var(--text-tertiary); min-width: 40px; text-align: right; }

/* Substitution table */
.sub-table { width: 100%; }
.sub-table-row {
  display: grid; grid-template-columns: 3px 1fr 1fr auto auto; gap: 10px; align-items: center;
  padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 12px;
}
.sub-table-row:last-child { border-bottom: none; }
.sub-table-row .base { color: var(--text-secondary); }
.sub-table-row .higher { color: var(--text-tertiary); }
.sub-table-row .save { font-weight: 600; min-width: 70px; text-align: right; }
.sub-table-header { font-weight: 600; color: var(--text-tertiary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }

/* Status bar */
.status-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(17,17,19,0.9); border-top: 1px solid var(--border);
  padding: 10px 24px; display: flex; align-items: center; justify-content: center;
  gap: 16px; font-size: 12px; color: var(--text-secondary);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); }
.status-dot.live { background: var(--green); }
.status-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

/* Responsive */
@media (max-width: 640px) {
  .app { padding: 24px 14px 100px; }
  .header h1 { font-size: 24px; }
  .inv-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .analysis-row { grid-template-columns: 3px 1fr auto auto; }
  .analysis-row .buy-cost { display: none; }
}
</style>
</head>

  <div class="tabs">

  <!-- INVENTORY TAB -->

    <div id="invContent"></div>

  <!-- ANALYSIS TAB -->

</div>

// ==================== HELPERS ====================
function fmt(n) {
  if(n==null||isNaN(n)) return '—';
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return Math.round(n).toLocaleString();
}

function getQty() { return Math.max(1, parseInt(document.getElementById('qty').value)||10); }

function getPrice(name) { return prices[name] || null; }

// Calculate needed quantities for everything
function calcNeeds(targetQty) {
  const needs = {};
  const mult = targetQty / RECIPE.makes;
  function walk(node, m, depth) {
    const q = (node.qty||1) * m;
    needs[node.name] = (needs[node.name]||0) + q;
    if(node.children && node.children.length) {
      const cm = node.makes ? q/node.makes : q;
      node.children.forEach(c => walk(c, cm, depth+1));
    }
  }
  RECIPE.children.forEach(d => walk(d, mult, 0));
  return needs;
}

// Calculate raw material cost to craft a node
function craftCost(node, multiplier) {
  if(!node.children || !node.children.length) return getPrice(node.name);
  let total = 0;
  const q = (node.qty||1) * multiplier;
  const cm = node.makes ? q/node.makes : q;
  for(const c of node.children) {
    const cq = (c.qty||1) * cm;
    const p = getPrice(c.name);
    if(p === null) return null;
    total += p * cq;
  }
  return total / q; // cost per unit
}

function draughtKey(name) {
  const n = name.toLowerCase();
  for(const k of DRAUGHTS) { if(n.includes(k)) return k; }
  return null;
}

function renderShopping(q) {
  // Build shopping needs based on view tier, minus inventory
  let shopEl = document.getElementById('shoppingSection');
  if(!shopEl) {
    const panel = document.getElementById('panel-recipe');
    shopEl = document.createElement('div');
    shopEl.id = 'shoppingSection';
    panel.appendChild(shopEl);
  }

  const needs = {};
  const mult = q / RECIPE.makes;

  function collect(node, m, depth) {
    const nq = (node.qty||1) * m;
    const tier = currentView==='compact'?1 : currentView==='elixirs'?2 : 99;
    if(depth >= tier || !node.children || !node.children.length) {
      needs[node.name] = (needs[node.name]||0) + nq;
      return;
    }
    const cm = node.makes ? nq/node.makes : nq;
    node.children.forEach(c => collect(c, cm, depth+1));
  }
  RECIPE.children.forEach(d => collect(d, mult, 0));

  const entries = Object.entries(needs).sort((a,b) => a[0].localeCompare(b[0]));
  let total = 0;
  let hasP = false;

  let h = '<div class="section-label" style="margin-top:28px">Shopping List</div><div class="card"><div class="card-header"><h2>Items to Buy</h2><span id="shopTotal" style="font-size:13px;font-weight:600;color:var(--green)">—</span></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">';
  entries.forEach(([name, raw]) => {
    const have = inventory[name]||0;
    const need = Math.max(0, Math.round(raw) - have);
    const p = getPrice(name);
    const cost = p ? p*need : 0;
    total += cost;
    if(p) hasP = true;
    h += '<div class="inv-item" style="border-bottom:1px solid var(--border);border-right:1px solid var(--border)">';
    h += '<span class="name">'+name+'</span>';
    h += '<span class="have-need">';
    if(have > 0) h += '<span style="font-size:11px;color:var(--green)">'+have+' had</span>';
    h += '<span style="font-weight:600;font-variant-numeric:tabular-nums">×'+need.toLocaleString()+'</span>';
    if(p && need > 0) h += '<span style="font-size:11px;color:var(--text-tertiary)">'+fmt(cost)+'</span>';
    h += '</span></div>';
  });
  h += '</div></div>';
  shopEl.innerHTML = h;

  const shopTot = document.getElementById('shopTotal');
  if(shopTot) shopTot.textContent = hasP ? fmt(total) : '—';
}

// ==================== ANALYSIS TAB ====================
function renderAnalysis() {
  const q = getQty();
  const mult = q / RECIPE.makes;
  const needs = calcNeeds(q);
  let h = '';

  // ---- STAT CARDS ----
  h += '<div class="stat-grid">';
  // Total raw cost
  let rawTotal = 0; let rawOk = true;
  function sumRaw(node, m) {
    const nq = (node.qty||1)*m;
    if(!node.children || !node.children.length) {
      const p = getPrice(node.name);
      if(p===null) rawOk=false;
      else rawTotal += p*nq;
      return;
    }
    const cm = node.makes ? nq/node.makes : nq;
    node.children.forEach(c => sumRaw(c, cm));
  }
  RECIPE.children.forEach(d => sumRaw(d, mult));

  // After inventory
  let invSavings = 0;
  if(rawOk) {
    Object.entries(inventory).forEach(([name, have]) => {
      const p = getPrice(name);
      if(p && needs[name]) {
        invSavings += p * Math.min(have, Math.round(needs[name]));
      }
    });
  }

  const harmonyPrice = getPrice('Harmony Draught');
  const sellRevenue = harmonyPrice ? harmonyPrice * q * (1-TAX_RATE) : null;
  const netProfit = (rawOk && sellRevenue!==null) ? sellRevenue - (rawTotal - invSavings) : null;

  h += '<div class="stat-card"><div class="stat-label">Raw Material Cost</div><div class="stat-value">'+(rawOk?fmt(rawTotal):'—')+'</div>';
  if(invSavings>0) h += '<div class="stat-sub stat-green">-'+fmt(invSavings)+' from inventory</div>';
  h += '</div>';

  h += '<div class="stat-card"><div class="stat-label">Sell Revenue (×'+q+')</div><div class="stat-value stat-gold">'+(sellRevenue!==null?fmt(sellRevenue):'—')+'</div>';
  h += '<div class="stat-sub">After 35% tax</div></div>';

  h += '<div class="stat-card"><div class="stat-label">Net Profit</div><div class="stat-value '+(netProfit!==null?(netProfit>=0?'stat-green':'stat-red'):'')+'">'+
    (netProfit!==null?(netProfit>=0?'+':'')+fmt(netProfit):'—')+'</div>';
  if(netProfit!==null && rawTotal>0) {
    const margin = ((netProfit/(rawTotal-invSavings))*100).toFixed(1);
    h += '<div class="stat-sub">'+(margin>=0?'+':'')+margin+'% margin</div>';
  }
  h += '</div>';

  // Bottleneck
  let bottleneck = null; let canMake = Infinity;
  Object.entries(needs).forEach(([name, need]) => {
    const have = inventory[name]||0;
    const perUnit = need / q;
    if(perUnit > 0) {
      const possible = Math.floor(have / perUnit);
      if(possible < canMake) { canMake = possible; bottleneck = name; }
    }
  });
  h += '<div class="stat-card"><div class="stat-label">Can Make Now</div><div class="stat-value stat-blue">'+(canMake===Infinity?'0':canMake)+'</div>';
  if(bottleneck && canMake < q) h += '<div class="stat-sub">Bottleneck: '+bottleneck+'</div>';
  h += '</div>';
  h += '</div>';

  // ---- SELL SEPARATELY VS MERGE ----
  h += '<div class="section-label">Sell Separately vs Merge</div>';
  h += '<div class="card analysis-card">';
  let separateTotal = 0; let sepOk = true;
  RECIPE.children.forEach(d => {
    const dp = getPrice(d.name);
    if(dp===null) sepOk = false;
    else separateTotal += dp * d.qty * mult * (1-TAX_RATE);
  });
  // Add catalyst cost to separate (you still spent it)
  const catCost = NPC_ITEMS['Spellbound Catalyst'] * 10 * mult * 5; // 10 per draught × 5 draughts

  const mergeRevenue = sellRevenue;
  h += '<div style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px">';

  h += '<div style="font-size:20px;font-weight:700">'+(mergeRevenue!==null?fmt(mergeRevenue):'—')+'</div></div>';

      const buyP = getPrice(e.name);

        const ip = getPrice(ing.name);

        else craftP += ip * ing.qty;
      });
      if(craftOk) craftP = craftP / (e.makes||1);

      h += '<div class="analysis-row">';
      h += '<span class="stripe stripe-'+dk+'"></span>';
      h += '<span class="label">'+e.name+'</span>';
      h += '<span class="craft-cost">'+(craftOk?fmt(craftP):'—')+'</span>';
      h += '<span class="buy-cost">'+(buyP?fmt(buyP):'—')+'</span>';
      if(craftOk && buyP) {
        const diff = buyP - craftP;
        const pct = ((diff/buyP)*100).toFixed(0);
        h += '<span class="verdict '+(diff>=0?'verdict-craft':'verdict-buy')+'">'+(diff>=0?'Craft ↓'+pct+'%':'Buy ↓'+Math.abs(pct)+'%')+'</span>';
      } else {
        h += '<span class="verdict" style="color:var(--text-tertiary)">—</span>';
      }
      h += '</div>';
    });
  });
  h += '</div>';

  // ---- COST BREAKDOWN ----
  h += '<div class="section-label">Cost Breakdown by Draught</div>';
  h += '<div class="card analysis-card">';
  const draughtCosts = [];
  let maxCost = 0;
  RECIPE.children.forEach(d => {
    const dq = d.qty * mult;
    let cost = 0; let ok = true;
    function sumD(node, m) {
      const nq = (node.qty||1)*m;
      if(!node.children||!node.children.length) {
        const p = getPrice(node.name); if(p===null) ok=false; else cost+=p*nq; return;
      }
      const cm = node.makes ? nq/node.makes : nq;
      node.children.forEach(c => sumD(c, cm));
    }
    sumD(d, mult);
    draughtCosts.push({name:d.name, key:d.key, cost:ok?cost:0, ok});
    if(ok && cost > maxCost) maxCost = cost;
  });
  const totalDCost = draughtCosts.reduce((s,d)=>s+d.cost,0);

  h += '<div class="cost-bars">';
  draughtCosts.forEach(d => {
    const pct = totalDCost > 0 ? (d.cost/totalDCost*100).toFixed(1) : 0;
    const w = maxCost > 0 ? (d.cost/maxCost*100) : 0;
    h += '<div class="cost-bar-row">';
    h += '<span class="cost-bar-label">'+d.name+'</span>';
    h += '<span class="cost-bar-track"><span class="cost-bar-fill" style="width:'+w+'%;background:'+DRAUGHT_COLORS[d.key]+'">'+(d.ok?fmt(d.cost):'—')+'</span></span>';
    h += '<span class="cost-bar-pct">'+(d.ok?pct+'%':'—')+'</span>';
    h += '</div>';
  });
  h += '</div></div>';

  // ---- HIGHER GRADE SUBSTITUTION ----
  h += '<div class="section-label">Higher-Grade Substitution Check</div>';
  h += '<div class="card analysis-card">';
  h += '<div class="sub-table-row sub-table-header"><span></span><span>Base Elixir (×30)</span><span>Higher Grade (×10)</span><span>Base Cost</span><span>Verdict</span></div>';
  let anySubData = false;
  RECIPE.children.forEach(d => {
    const dk = d.key;
    d.children.forEach(e => {
      if(!e.children||!e.children.length) return;
      const hg = HIGHER_GRADE[e.name];
      if(!hg) return;
      const baseP = getPrice(e.name);
      const higherP = prices[hg.name] || null;
      // Base: 30 units. Higher: 10 units (1:3 ratio)
      const baseCost = baseP ? baseP * 30 : null;
      const higherCost = higherP ? higherP * 10 : null;
      anySubData = true;

      h += '<div class="sub-table-row">';
      h += '<span class="stripe stripe-'+dk+'"></span>';
      h += '<span class="base">'+e.name+' '+(baseP?fmt(baseP)+'/ea':'')+'</span>';
      h += '<span class="higher">'+hg.name+' '+(higherP?fmt(higherP)+'/ea':'?')+'</span>';
      h += '<span class="save">'+(baseCost?fmt(baseCost):'—')+'</span>';
      if(baseCost && higherCost) {
        const diff = baseCost - higherCost;
        h += '<span class="save" style="color:'+(diff>0?'var(--green)':'var(--red)')+'">'+(diff>0?'Save '+fmt(diff):'Costs +'+fmt(Math.abs(diff)))+'</span>';
      } else {
        h += '<span class="save" style="color:var(--text-tertiary)">No data</span>';
      }
      h += '</div>';
    });
  });
  if(!anySubData) h += '<div style="padding:16px 20px;color:var(--text-tertiary);font-size:13px">Load prices first to see substitution analysis</div>';
  h += '</div>';

  document.getElementById('analysisContent').innerHTML = h;
}

// ==================== PRICE LOADING ====================
async function loadPrices() {
  const btn = document.getElementById('priceBtn');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  btn.disabled = true;
  btn.textContent = 'Loading...';
  dot.className = 'status-dot loading';

  // Collect all IDs including draughts and higher-grade
  const allIds = {...ITEM_IDS};
  Object.values(HIGHER_GRADE).forEach(hg => { allIds[hg.name] = hg.id; });

  const entries = Object.entries(allIds);
  let loaded = 0;

  // Batch in groups of 5 for speed
  for(let i = 0; i < entries.length; i += 5) {
    const batch = entries.slice(i, i+5);
    await Promise.all(batch.map(async ([name, id]) => {
      try {
        const r = await fetch('https://api.arsha.io/v2/mena/item?id='+id);
        if(r.ok) {
          const d = await r.json();
          if(d.lastSoldPrice) { prices[name] = d.lastSoldPrice; loaded++; }
        }
      } catch(e){}
    }));
    text.textContent = 'Loading '+loaded+'/'+entries.length+'...';
  }

  savePrices();
  btn.disabled = false;
  btn.textContent = '↻ Refresh';
  recalc();
}

// ==================== NAVIGATION ====================
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='recipe') renderRecipe();
  else if(tab==='inventory') renderInventory();
  else if(tab==='analysis') renderAnalysis();
}

function setView(v, btn) {
  currentView = v;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderRecipe();
}

function recalc() {
  if(currentTab==='recipe') renderRecipe();
  else if(currentTab==='inventory') renderInventory();
  else if(currentTab==='analysis') renderAnalysis();
  updateStatus();
}

function updateStatus() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const total = document.getElementById('statusTotal');
  const loaded = Object.keys(prices).length;
  if(loaded <= 1) {
    dot.className = 'status-dot';
    text.textContent = 'Prices not loaded';
    total.textContent = '';
  } else {
    dot.className = 'status-dot live';
    text.textContent = loaded+' prices loaded · MENA';
    // calc total
    const q = getQty();
    const mult = q / RECIPE.makes;
    let t = 0;
    function s(n,m){const nq=(n.qty||1)*m;if(!n.children||!n.children.length){t+=(prices[n.name]||0)*nq;return;}const cm=n.makes?nq/n.makes:nq;n.children.forEach(c=>s(c,cm));}
    RECIPE.children.forEach(d=>s(d,mult));
    total.textContent = t>0?'Total: '+fmt(t):'';
  }
}

// Init
renderRecipe();
</script>
