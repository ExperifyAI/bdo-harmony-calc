function money(v){return '<span class="'+cls(v)+'">'+fmt(v)+'</span>'}function td(x){return '<td>'+x+'</td>'}function table(headers,body){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('notice').textContent=recipes.length+' production recipes loaded (not the full alchemy catalog). '+marketSource+'. Zero stock is a sourcing constraint, not zero cost.';if(tab==='catalog')catalog();if(tab==='detail')detail();if(tab==='inventory')items(true);if(tab==='market')items(false);if(tab==='settings')settingsView();}
function catalog(){let rows=recipes.map(metrics).filter(x=>x.r.name.toLowerCase().includes(search.toLowerCase())||name(x.r.blue).toLowerCase().includes(search.toLowerCase()));const columns=[['Recipe','name',x=>x.r.name],['Inputs / craft','inputs',x=>x.r.inputs.map(i=>name(i.id)+' ×'+i.qty).join(', ')],['Direct cost / craft','cost',x=>x.d.cost==null?null:x.d.cost/settings.crafts],['Direct net / h','direct',x=>x.d.hour],['Recursive net / h','recursive',x=>x.a.hour],['Cash net / h (owned)','cash',x=>x.j.cashHour],['Sale price','price',x=>price(x.r.id)],['Market stock','stock',x=>stock(x.r.id)],['Volume field','volume',x=>market[x.r.id]?.fourteenDayVolume??null],['Sourcing','sourcing',x=>x.j.unknown.size?'Missing prices':Object.keys(x.j.short).length?'Shortage':'Available']];const key=(columns.find(c=>c[1]===sort)||columns[4])[2];rows.sort((a,b)=>{const u=key(a),v=key(b);if(u==null||v==null)return u==null?(v==null?0:1):-1;const cmp=typeof u==='string'?u.localeCompare(v):u===v?0:u<v?-1:1;return sortDir*cmp||a.r.name.localeCompare(b.r.name)});$('root').innerHTML='<h2>Crafting calculator</h2><div class="controls"><input id="search" placeholder="Search recipes…" value="'+esc(search)+'"><label>Crafts<input type="number" id="batch" min="1" max="100000" value="'+settings.crafts+'"></label><label>Rank by<select id="sort">' +columns.map(c=>'<option value="'+c[1]+'">'+c[0]+'</option>').join('')+'</select></label><small>'+rows.length+' recipes · Click a recipe for details</small></div><div class="panel">'+table(columns.map(c=>'<button type="button" class="sorthead" data-sort="'+c[1]+'" aria-label="Sort by '+esc(c[0])+(sort===c[1]?(sortDir===1?' ascending':' descending'):'')+'">'+esc(c[0])+' <span aria-hidden="true">'+(sort===c[1]?(sortDir===1?'▲':'▼'):'↕')+'</span></button>'),rows.map(x=>'<tr>'+td('<button class="link" data-id="'+x.r.id+'">'+esc(x.r.name)+'</button><br><small>'+esc(x.r.kind==='simple'?'Simple Alchemy':x.r.blue?'Alchemy · normal + blue':'Alchemy')+'</small>')+td(x.r.inputs.map(i=>esc(name(i.id))+' ×'+i.qty).join('<br>'))+td(fmt(x.d.cost==null?null:x.d.cost/settings.crafts))+td(money(x.d.hour))+td(money(x.a.hour))+td(money(x.j.cashHour))+td(fmt(price(x.r.id)))+td(stock(x.r.id)??'—')+td(market[x.r.id]?.fourteenDayVolume??'—')+td('<span class="'+(x.j.unknown.size||Object.keys(x.j.short).length?'warn':'pos')+'">'+(x.j.unknown.size?'Missing prices':Object.keys(x.j.short).length?'Shortage':'Available')+'</span>')+'</tr>').join(''))+'</div>';$('sort').value=sort;$('search').oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;catalog();$('search').focus();$('search').setSelectionRange(pos,pos)};$('sort').onchange=e=>{sort=e.target.value;sortDir=['name','inputs','sourcing','cost'].includes(sort)?1:-1;catalog()};document.querySelectorAll('[data-sort]').forEach(b=>{b.closest('th').setAttribute('aria-sort',b.dataset.sort===sort?(sortDir===1?'ascending':'descending'):'none');b.onclick=()=>{const k=b.dataset.sort;sortDir=k===sort?-sortDir:['name','inputs','sourcing','cost'].includes(k)?1:-1;sort=k;catalog();document.querySelector('[data-sort="'+k+'"]').focus()}});$('batch').onchange=e=>{settings.crafts=Math.max(1,Math.min(100000,Math.floor(+e.target.value)||1));render()};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=+b.dataset.id;tab='detail';render()});}
function detail(){let r=find(selected);if(!r){tab='catalog';return render()}let x=metrics(r);const card=(title,p)=>'<div class="panel"><h3>'+title+'</h3><div class="cards">'+[['Economic profit/h',p.hour],['Cash profit/h',p.cashHour],['Cash to spend',p.cash],['Owned opportunity cost',p.opp],['Net sale revenue',p.revenue],['Time (hours)',p.seconds/3600]].map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+fmt(v)+'</strong></div>').join('')+'</div><p class="notice">'+(p.unknown.size?'Unpriced: '+[...p.unknown].map(name).join(', '):'All required prices present')+' · '+(Object.keys(p.short).length?'Stock shortages: '+Object.keys(p.short).map(name).join(', '):'No snapshot shortages')+'</p>'+table(['Ingredient','Owned used','Purchase qty','Unit price','Market stock','Unfilled stock'],[...new Set([...Object.keys(p.buy),...Object.keys(p.used)])].map(i=>'<tr>'+td(esc(name(i)))+td(fmt(p.used[i]||0))+td(fmt(p.buy[i]||0))+td(fmt(price(i)))+td(stock(i)??'—')+td(fmt(p.short[i]||0))+'</tr>').join(''))+'<h3>Production queue</h3>'+table(['Recipe','Crafts','Seconds'],Object.entries(p.stages).map(([i,n])=>'<tr>'+td(esc(name(i)))+td(n)+td(fmt(n*duration(find(i))))+'</tr>').join(''))+'<h3>Expected outputs</h3>'+table(['Output','Quantity','Unit price'],p.outputs.map(([i,q])=>'<tr>'+td(esc(name(i)))+td(fmt(q))+td(fmt(price(i)))+'</tr>').join(''))+'</div>';$('root').innerHTML='<button id="back">← All recipes</button><h2 style="margin-top:14px">'+esc(r.name)+'</h2><small>'+esc(r.source)+' · '+settings.crafts+' final crafts</small><div class="split">'+card('Buy immediate inputs · using inventory',x.i)+card('Manufacture recursively · using inventory',x.j)+'</div><div class="split">'+card('Buy immediate inputs · no inventory',x.d)+card('Manufacture recursively · no inventory',x.a)+'</div>';$('back').onclick=()=>{tab='catalog';render()}}
function items(isInv){const ids=[...new Set([...Object.keys(names),...Object.keys(market),...Object.keys(overrides)])].sort((a,b)=>name(a).localeCompare(name(b)));$('root').innerHTML='<h2>'+(isInv?'Inventory':'Market snapshot')+'</h2><div class="controls"><button id="export">Export '+(isInv?'inventory':'market overrides')+'</button><label>Import JSON<input type="file" id="import" accept=".json"></label></div><div class="panel">'+table(isInv?['Item','Owned']:['Item','Market price','Stock','Override price'],ids.map(i=>'<tr>'+td(esc(name(i)))+(isInv?td('<input data-key="'+esc(i)+'" type="number" min="0" value="'+owned(i)+'">'):td(fmt(market[i]?.price))+td(stock(i)??'—')+td('<input data-key="'+esc(i)+'" type="number" min="0" placeholder="—" value="'+(overrides[i]??'')+'">'))+'</tr>').join(''))+'</div>';document.querySelectorAll('[data-key]').forEach(e=>e.onchange=()=>{if(isInv)inventory[name(e.dataset.key)]=Math.max(0,+e.value||0);else if(e.value==='')delete overrides[e.dataset.key];else overrides[e.dataset.key]=Math.max(0,+e.value||0)});$('export').onclick=()=>download(isInv?inventory:overrides,isInv?'inventory.json':'market-overrides.json');$('import').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(isInv){if(!x||Array.isArray(x)||!Object.values(x).every(v=>typeof v==='number'&&v>=0&&Number.isFinite(v)))throw Error('Invalid inventory');inventory=x;}else{const rs=x.result?.data??x.data;if(!Array.isArray(rs)||!rs.length||x.region&&x.region!=='MENA')throw Error('Expected MENA market snapshot');market=Object.fromEntries(rs.map(r=>[r.itemId,r]));marketSource='Imported MENA snapshot (region must be verified)';}render()}catch(e){alert(e.message)}}}
function download(obj,file){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function settingsView(){$('root').innerHTML='<h2>Model settings</h2><div class="panel"><p class="notice">Mastery reference: 3,142 buffed. Yields are editable assumptions, not a verified mastery table. Byproduct value defaults to zero. Owned ingredients use net alternative sale value; purchased ingredients use gross price. All manufacturing stages count toward time.</p><div class="controls">'+Object.entries(settings).map(([k,v])=>'<label>'+esc(({normal:'Normal elixirs per craft',blue:'Blue elixirs per craft',single:'Single-output average',seconds:'Alchemy seconds',simple:'Simple Alchemy seconds',net:'Net sale factor',byproduct:'Net byproducts per alchemy craft',crafts:'Final crafts'})[k])+'<input data-setting="'+k+'" type="number" min="0" step="any" value="'+v+'"></label>').join('')+'</div><button id="save">Apply</button></div>';$('save').onclick=()=>{const n={};document.querySelectorAll('[data-setting]').forEach(e=>n[e.dataset.setting]=+e.value);if(!Object.values(n).every(Number.isFinite)||n.normal<=0||n.single<=0||n.blue<0||n.seconds<=0||n.simple<=0||n.net<0||n.net>1||n.byproduct<0||n.crafts<1||n.crafts>100000){alert('Invalid setting');return}n.crafts=Math.floor(n.crafts);settings=n;tab='catalog';render()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></html>
