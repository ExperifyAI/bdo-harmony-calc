const HELP={"Recipe":"Click a recipe to open four plans: direct and recursive, each with and without inventory.","Inputs / craft":"Immediate ingredients for one final crafting operation, before expanding intermediate recipes.","Direct cost / craft":"Gross purchase cost of all immediate ingredients divided by final crafts. No inventory or intermediate manufacturing.","Direct net / h":"(After-tax output sales + assumed net byproducts − immediate ingredient purchase costs) × 3600 ÷ final crafting seconds. Theoretical if inputs are unavailable.","Recursive net / h":"(After-tax sales, surplus and byproducts − purchased raw materials) × 3600 ÷ all crafting seconds. Manufactures every intermediate with a known recipe; buys other inputs. No inventory. Not a cheapest-path optimizer.","Cash net / h (owned)":"Recursive plan using your inventory first. (Net revenue − cash purchases) ÷ total crafting hours. Does not deduct the resale value of owned materials, so this is cash flow rather than economic profit.","Sale price":"Gross unit price of the normal-grade product. Blue output is priced separately in revenue.","Market stock":"Units of the normal product listed for purchase in the market snapshot; not demand or guaranteed sales.","Volume field":"Provider-reported fourteenDayVolume for the normal product. Not a guaranteed sales rate.","Sourcing":"Status of the recursive plan with inventory. Missing prices suppress profit calculations; Shortage means purchases exceed snapshot stock or stock is unknown. Available means no modeled shortage.","Crafts":"Number of final recipe operations, not finished units. Intermediate operations are additional.","Rank by":"Choose a sorting column; click a heading to reverse direction. Missing values remain at the bottom.","Economic profit/h":"(Net sales including surplus and modeled byproducts − cash purchases − opportunity cost of owned inputs) ÷ total crafting hours.","Cash profit/h":"(Net sales including surplus and modeled byproducts − cash purchases) ÷ total crafting hours. Owned inputs are not deducted.","Cash to spend":"Gross purchase cost for priced missing inputs. If prices are missing, this is only a partial expense.","Owned opportunity cost":"Owned ingredients consumed × their unit price × net sale factor; represents proceeds forgone by crafting instead of selling.","Net sale revenue":"Normal, blue and leftover output quantities × their individual prices × net sale factor, plus assumed net alchemy byproducts.","Time (hours)":"All modeled crafting operations × configured seconds per operation, divided by 3600. Excludes gathering, transport and waiting.","Ingredient":"A purchased or owned input consumed by this production plan.","Owned used":"Quantity consumed from inventory. Each scenario starts with a separate copy of your inventory.","Purchase qty":"Quantity bought after accounting for inventory and, in recursive mode, manufacturing.","Unit price":"Custom override first, then NPC price, then market snapshot. Missing prices are not zero.","Unfilled stock":"Required purchases beyond market stock, or with unknown stock. Profit remains theoretical.","Production queue":"Summary of final and intermediate crafting operations. Not necessarily execution order.","Seconds":"Craft operations × configured duration for this recipe type.","Expected outputs":"Final output and unconsumed intermediate or blue-grade surplus. Quantities are averages, not guaranteed yields.","Quantity":"Expected output units, based on configured or fixed recipe yields.","Normal elixirs per craft":"Expected average normal output, default 3.5; not a verified mastery curve.","Blue elixirs per craft":"Expected average blue output, default 0.5; blue outputs are valued separately.","Single-output average":"Average yield for non-fixed recipes without blue variants, e.g. reagents and oils. Fixed recipe outputs override this.","Alchemy seconds":"Seconds per alchemy-tool operation, default 1. Set to actual cycle time.","Simple Alchemy seconds" ng the output, choose Profit / h.","Output availability":"Can you actually buy the same expected mix of finished items instead of crafting? Normal and blue stock are checked separately.","Owned coverage":"How many times you can craft with your recorded inventory alone, before buying anything else. Does not count alternative ingredients.","Gross unit price":"The full price you pay for one item. A manual price or NPC price may replace the saved market price.","Net proceeds":"The silver you receive after selling this output and paying tax.","Input cost":"The quantity of this ingredient needed for one craft multiplied by its purchase price.","Profit (batch)":"The total profit or loss if you buy all ingredients, perform the selected number of crafts, and sell the output.","Input cost (batch)":"The total silver required to buy every ingredient for the selected number of crafts.","Net revenue (batch)":"The total silver you receive after selling the selected batch of finished outputs and paying tax.","Net sale factor":"How much of the market sale price you keep. Enter 0.845 if selling a 100M item gives you 84.5M.","Normal elixirs per craft":"How many normal elixirs you get on average per craft. Change this if your own test results differ.","Blue elixirs per craft":"How many higher-grade elixirs you get on average per craft, separately from the normal ones.","Single-output average":"Average number of items produced when a recipe has no blue-grade output and no fixed quantity.","Alchemy seconds":"How long one alchemy-tool craft takes. Set this to your actual time to get a useful hourly profit.","Simple Alchemy seconds":"How long one Simple Alchemy operation takes. This includes draught recipes.","Net byproducts per alchemy craft":"Currently not included in the recipe profitability table.","Final crafts":"How many times to perform each recipe in the calculator.","Owned":"How many of the item you have in storage according to your recorded inventory. Changes stay in this browser function stageMetrics(r){
const n=settings.crafts,inputs=r.inputs.map(i=>({id:i.id,qty:i.qty,price:price(i.id),stock:stock(i.id)})),outputs=[{id:r.id,qty:output(r),price:price(r.id)}];
if(r.blue&&bonus(r)>0)outputs.push({id:r.blue,qty:bonus(r),price:price(r.blue)});
const cost=inputs.some(i=>i.price==null)?null:inputs.reduce((a,i)=>a+i.qty*i.price,0);
const revenue=outputs.some(i=>i.price==null)?null:outputs.reduce((a,i)=>a+i.qty*i.price*settings.net,0);
const gross=outputs.some(i=>i.price==null)?null:outputs.reduce((a,i)=>a+i.qty*i.price,0);
const ownedCost=inputs.some(i=>i.price==null||(npc[i.id]==null&&!market[i.id]))?null:inputs.reduce((a,i)=>a+i.qty*i.price*(npc[i.id]!=null?1:settings.net),0);
const profit=cost==null||revenue==null?null:revenue-cost;
const savings=cost==null||gross==null?null:gross-cost;
const ownedGain=ownedCost==null||revenue==null?null:revenue-ownedCost;
const ownedSavings=ownedCost==null||gross==null?null:gross-ownedCost;
const recommendation=profit==null||savings==null?'UNKNOWN':profit>0?'CRAFT & SELL':savings>0?'CRAFT FOR USE':'BUY';
const hour=profit==null?null:profit*3600/duration(r);
const margin=profit==null||!revenue?null:profit/revenue*100;
const needs={};for(const i of inputs)needs[i.id]=(needs[i.id]||0)+i.qty*n;
const short=Object.keys(needs).filter(id=>stock(id)==null||stock(id)<needs[id]);
const missing=[...new Set([...inputs,...outputs].filter(i=>i.price==null).map(i=>i.id))];
const outputShort=outputs.filter(i=>stock(i.id)==null||stock(i.id)<Math.ceil(i.qty*n)).map(i=>i.id);
const ownedCoverage=Math.min(...Object.keys(needs).map(id=>Math.floor(owned(id)/(needs[id]/n))));
return {r,n,inputs,outputs,cost,revenue,gross,ownedCost,profit,savings,ownedGain,ownedSavings,recommendation,hour,margin,short,missing,outputShort,ownedCoverage};
}

ary)+'</div><h3>Star of Nostos — recorded drops only</h3><p class="muted">Not your full inventory. Existing pieces, purchases and other sessions are not included.</p><div class="panel">'+table(['Piece','Recorded drops','Goal','Remaining from records'],progress)+'</div><h3>Experiment backlog</h3><div class="panel">'+table(['Category','Spot','Resource','Reason'],SESSION_ROUTES.map(r=>'<tr>'+r.map(x=>td(esc(x))).join('')+'</tr>').join(''))+'</div>';
$('sessionFilter').value=sessionFilter;$('sessionFilter').onchange=e=>{sessionFilter=e.target.value;sessionView()};document.querySelectorAll('[data-ssort]').forEach(b=>b.onclick=()=>{const k=b.dataset.ssort;sessionDir=k===sessionSort?-sessionDir:['date','spot','category','agris'].includes(k)?1:-1;sessionSort=k;sessionView()});$('sessionAdd').onclick=()=>sessionForm(null);document.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick=()=>sessionForm(sessionRows.find(r=>r.id===b.dataset.editSession)));$('sessionExport').onclick=()=>download(sessionRows,'bdo-sessions.json');$('sessionImport').onchange=async e=>{try{const rows=JSON.parse(await e.target.files[0].text());if(!Array.isArray(rows)||!rows.every(validSession)||new Set(rows.map(r=>r.id)).size!==rows.length)throw Error('Invalid session data');if(!confirm('Replace session list?'))return;sessionRows=rows;if(!sessionSave())alert('Browser storage unavailable; export to retain changes.');sessionView()}catch(e){alert(e.message)}};}
function sessionForm(r){const a=r||{date:new Date().toISOString().slice(0,10),category:'Fluid Collecting',spot:'',resource:'',character:'',mastery:null,minutes:60,silver:0,basis:'Garmoth reported; tax unconfirmed',primary:null,nostos:null,agris:'Unknown',notes:'',url:''};const field=(k,l,t='text')=>'<label>'+esc(l)+'<input id="sf-'+k+'" type="'+t+'" '+(t==='number'?'min="0" step="any" ':'')+'value="'+esc(a[k]??'')+'"></label>';const sel=(k,l,opts)=>'<label>'+l+'<select id="sf-'+k+'">'+opts.map(x=>'<option'+(a[k]===x?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>';$('root').innerHTML='<button id="sfBack">← Sessions</button><h2 style="margin-top:15px">'+(r?'Edit':'Add')+' session</h2><div class="panel"><form id="sf"><div class="controls">'+field('date','Date','date')+sel('category','Category',sessionCategories)+field('spot','Spot')+field('resource','Primary resource')+field('character','Class / spec')+field('mastery','Mastery','number')+field('minutes','Duration (minutes)','number')+field('silver','Total reported silver (not per hour)','number')+field('primary','Primary quantity','number')+field('nostos','Nostos pieces','number')+sel('agris','Agris',['Unknown','Yes','No'])+field('basis','Valuation basis')+field('url','Garmoth URL','url')+field('notes','Buffs, costs and notes')+'</div><button type="submit">Save session</button> '+(r?'<button type="button" id="sfDelete">Delete session</button>':'')+'</form></div>';$('sfBack').onclick=sessionView;$('sf').onsubmit=e=>{e.preventDefault();const x={id:r?.id??(crypto.randomUUID?.()??String(Date.now()))};for(const k of ['date','category','spot','resource','character','basis','agris','notes','url'])x[k]=$('sf-'+k).value;for(const k of ['mastery','minutes','silver','primary','nostos']){const v=$('sf-'+k).value;x[k]=v===''?null:Number(v)}if(!validSession(x)){alert('Enter a spot, positive duration and valid nonnegative quantities.');return}sessionRows=r?sessionRows.map(z=>z.id===r.id?x:z):[...sessionRows,x];if(!sessionSave())alert('Browser storage unavailable; export to retain changes.');sessionView()};if(r)$('sfDelete').onclick=()=>{if(confirm('Delete this session?')){sessionRows=sessionRows.filter(z=>z.id!==r.id);sessionSave();sessionView()}};}

const TASKS=[["sailors","Recruit final 2 Innocent Goblins","Account","P0","In progress","9/11 boarded; crew 90/110; first mate already aboard; roster 11/19."],["saillevel","Level goblins to 10 and optimize positions","Account","P1","Pending","Retain cargo capacity for bartering."],["farm","Restore farming setup and confirm crop choice","Account","P0","In progress","Truffle Hypha planted; verify fences and long-term crop choice."],["roles","Finalize character assignments","Account","P1","Pending","Assign remaining alts to gathering, farming, sailing and energy roles."],["workshop","Review LoML Royal Workshop","Account","P1","Pending","Existing active workshop; verify Yukjo location, workers and profitability."],["hyperboost","Inspect Hyperboost rewards","Account","P1","Pending","Claim relevant veteran rewards."],["solare","Set up Awakening Lahn for Arena of Solare","Combat","P1","Pending","Gear, skills, add-ons, protected movement and combos."],["musa","Tag Awakening Musa for PvE","Combat","P1","Pending","Keep Guardian; test Musa before permanent changes."],["edania-test","Compare Guardian and Musa in Inner Edania","Combat","P1","Pending","Record net silver/h, trash, buffs and comfort."],["fox","Test Fox Blood","Gathering","P1","Done","26,265 blood; 2.421B/h reported."],["scorpion","Test Atumach Scorpions","Gathering","P1","Done","13,861 meat; 2.344B/h reported."],["scorpion-musa","Retest Atumach on Musa","Gathering","P1","Pending","Compare movement and yield."],["thuja","Test Thuja Sap","Gathering","P1","Pending","Harmony bottleneck."],["ash","Test Ash Sap","Gathering","P1","Pending","Harmony bottleneck."],["snow","Test Snowfield Cedar Sap","Gathering","P1","Pending","Harmony bottleneck."],["truffle","Test Truffle Mushroom","Gathering","P1","Pending","Server hopping acceptable."],["compare","Compare gathering rotations","Gathering","P1","In progress","Revalue scarce materials; avoid double counting."],["delotia","Test Delotia","Gathering","P2","Deferred","Revisit if ive","PvE; compare Awakening Musa tag"],["PvE tag","Awakening Musa","Planned","Movement and rotation tests"],["Arena of Solare","Awakening Lahn","Planned","Configure skills and gear"],["Lifeskill main","Unspecified","Active","High weight and inventory; alchemy, cooking, gathering"],["Imperial delivery","Heidel alt","Assigned","Daily delivery"],["Fishing","Dedicated alt","Assigned","Miraculous Tank"],["Bartering","Barter alt / lifeskill main","Assigned","Main when energy refill is useful"],["Vell","Dedicated alt","Assigned","Boss"],["Garmoth","Dedicated alt","Assigned","Boss"],["LoML bosses","Dedicated alts","Assigned","One at each boss"],["Farming / herb gathering","Unspecified","To assign","Review alt roster"]], DEV_BACKLOG=[["Recipe database expansion","Pending","40 recipes currently; verified full alchemy coverage needed."],["Market coverage and refresh","In progress","On-demand MENA snapshot; automatic refresh deferred."],["Ingredient substitutions and mastery yields","Pending","Validate game data and observed procs."],["Recipe opportunity detector","Pending","Demand, margins, sourcing."],["Garmoth integration","Pending","Keep raw sessions there."],["Cooking calculator","Pending","Full cooking recipes not yet imported."],["Imperial calculator","Pending","Port spreadsheet calculations; validate rates and shared delivery constraints."],["Custom residual valuation calculator","Pending","Delotia and other non-market inputs."],["Cross-device persistence","Pending","Browser changes currently local; repository seeds managed by assistant."]];
let account={task:{},routine:{},sailors:9,roles:{},extras:[]};
try{const a=JSON.parse(localStorage.getItem('bdo-account-v1'));if(a&&typeof a==='object')account={...account,...a}}catch(e){}
function saveAccount(){try{localStorage.setItem('bdo-account-v1',JSON.stringify(account))}catch(e){alert('Browser storage unavailable. Changes will not survive reload.');}}
const allTasks=()=>[...TASKS,...(Array.isArray(account.extras)?account.extras:[])];
const taskState=t=>account.task[t[0]]||t[4];
const TZ=3*3600000,DAY=86400000;
const schedules={cook:{day:null,h:0,label:'Daily 00:00 Türkiye time (community guide)'},alch:{day:null,h:0,label:'Daily 00:00 Türkiye time (assumed same delivery reset)'},edania:{day:4,h:3,label:'Thursday 03:00 Türkiye time (00:00 UTC; guide)'},shrine:{day:0,h:0,label:'Sunday 00:00 Türkiye time (provisional regional interpretation)'},loml:{day:4,h:0,label:'Thursday 00:00 Türkiye time (weekly reward; regional time provisional)'},fishing:{day:0,h:0,label:'Sunday 00:00 Türkiye time (MENA notice)'}};
const bossTimes={garmoth:[[0,0,15],...[0,1,2,3,4,5,6].map(d=>[d,14,0]),...[0,1,2,3,4,5].map(d=>[d,23,15])],vell:[[4,0,15],[0,17,0]]};
function nextBoundary(r,now=Date.now()){const d=new Date(now+TZ),mid=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-TZ;
if(r[0]==='sailcheck')return Math.floor((now+TZ)/3600000)*3600000+3600000-TZ;
if(bossTimes[r[0]]){let best=Infinity;for(let i=0;i<=7;i++){const day=(d.getUTCDay()+i)%7;for(const [wd,h,m] of bossTimes[r[0]])if(wd===day){const t=mid+i*DAY+(h*60+m)*60000;if(t>now)best=Math.min(best,t)}}return best;}
const sc=schedules[r[0]];if(!sc)return null;let t=mid+sc.h*3600000;if(sc.day==null){if(t<=now)t+=DAY;return t}t+=((sc.day-d.getUTCDay()+7)%7)*DAY;if(t<=now)t+=7*DAY;return t;}
function periodKey(r){const t=nextBoundary(r);return t==null?'manual':'schedule-v2:'+t}
const routineDone=r=>account.routine[r[0]]===periodKey(r);
function countdown(t){if(t==null)return 'No fixed deadline';let m=Math.max(0,Math.ceil((t-Date.now())/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return (d?d+'d ':'')+(h?h+'h ':'')+(m%60)+'m'}
function scheduleLabel(r){return schedules[r[0]]?.label||(bossTimes[r[0]]?'Next spawn · MENA schedule':r[0]==='sailcheck'?'Next hourly reminder (not guaranteed spawn)':'Manual / when ready')}
function updateRoutineTimers(){if(tab!=='routine')return;let stale=false;document.querySelectorAll('[data-timer]').forEach(e=>{const r=ROUTINES.find(x=>x[0]===e.dataset.timer);if(!r)return;const t=nextBoundary(r);e.textContent=(bossTimes[r[0]]?'Spawn in ':r[0]==='sailcheck'?'Check in ':t?'Resets in ':'')+countdown(t);if(e.dataset.period!==periodKey(r))stale=true});if(stale)routineView()}
function sailorPanel(){const n=Math.max(0,Math.min(11,Number(account.sailors)||0));return '<div class="panel"><h3>Innocent Goblin recruitment '+info('Sailor progress')+'</h3><div class="cards"><div class="metric"><small>Recruited</small><strong>'+n+' / 11</strong></div><div class="metric"><small>Cabins (10 per goblin)</small><strong>'+n*10+' / 110</strong></div><div class="metric"><small>Remaining recruits</small><strong>'+(11-n)+'</strong></div></div><div class="meter"><div style="width:'+n/11*100+'%"></div></div><div class="controls"><button id="sailMinus" '+(n===0?'disabled':'')+'>−</button><button id="sailPlus" '+(n===11?'disabled':'')+'>+ Recruit</button><small>First Mate boarded · roster 11/19 at last screenshot · 90/110 cabins at last screenshot</small></div></div>'}

function accountOverview(){const open=allTasks().filter(t=>!['Done','Deferred'].includes(taskState(t))).length;const rr=ROUTINES.filter(r=>r[0]!=='sailcheck'||account.sailors<11);$('root').innerHTML='<h2>Account overview</h2><p class="muted">BDO MENA · personal planning dashboard. Values reflect the last reported account state, not live game data.</p><div class="cards">'+[['Open objectives',open],['Recurring checked',rr.filter(routineDone).length+' / '+rr.length],['Imperial cooking stock','10,000 boxes'],['Daily delivery target','248 boxes'],['Carrack Advance','+10 green gear'],['Last reported alchemy mastery','3,142 buffed']].map(([k,v])=>'<div class="metric"><small>'+esc(k)+'</small><strong>'+esc(v)+'</strong></div>').join('')+'</div>'+sailorPanel()+'<div class="panel"><h3>Quick navigation</h3><div class="controls">'+[['tasks','One-time tasks'],['routine','Recurring activities'],['roles','Character assignments'],['sessions','Gathering sessions'],['catalog','Alchemy'],['imperial','Imperial delivery']].map(([k,v])=>'<button data-jump="'+k+'">'+v+'</button>').join('')+'</div></div>';bindSailors();document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{tab=b.dataset.jump;render()})}

function routineView(){const rr=ROUTINES.filter(r=>r[0]!=='sailcheck'||account.sailors<11);$('root').innerHTML='<h2>Recurring activities</h2><p class="notice">Countdowns use Türkiye time (UTC+3). World bosses show next spawn, not a reward quota reset. Provisional reset times are labelled. As-needed tasks have no fixed deadline. Old checklist marks may need to be checked again after the schedule migration.</p>'+['Daily','Hourly','Weekly','Boss schedule','As needed'].map(g=>{const rows=rr.filter(r=>r[2]===g);return rows.length?'<div class="panel"><h3>'+g+'</h3>'+rows.map(r=>'<div class="taskrow"><div><span class="taskname">'+esc(r[1])+'</span><small>'+esc(r[3])+'</small><small>'+esc(scheduleLabel(r))+'</small></div><span class="priority muted"><strong data-timer="'+esc(r[0])+'" data-period="'+esc(periodKey(r))+'">'+(bossTimes[r[0]]?'Spawn in ':nextBoundary(r)?'Resets in ':'')+countdown(nextBoundary(r))+'</strong><br>'+(routineDone(r)?'Completed':'Open')+'</span><div><input type="checkbox" aria-label="Complete '+esc(r[1])+'" data-routine="'+esc(r[0])+'" '+(routineDone(r)?'checked':'')+'></div></div>').join('')+'</div>':''}).join('')+(account.sailors>=11?'<p class="muted">Hourly sailor checks retired — recruitment complete.</p>':'');document.querySelectorAll('[data-routine]').forEach(b=>b.onchange=()=>{const r=ROUTINES.find(r=>r[0]===b.dataset.routine);if(b.checked)account.routine[r[0]]=periodKey(r);else delete account.routine[r[0]];saveAccount();routineView()})}
